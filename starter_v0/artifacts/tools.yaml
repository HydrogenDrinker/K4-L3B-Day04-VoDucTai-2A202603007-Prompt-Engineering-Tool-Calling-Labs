# starter_v0 — intentionally incomplete first-draft declarations.
# Students improve routing guidance, argument conventions, missing-information
# handling, and confirmation boundaries through v1/v2/v3.
#
# Keep built-in names and supplied evaluation cases unchanged.
# Improve descriptions and compatible schemas. Declare team-built bonus tools
# here and in tools/__init__.py, then test them with team-authored cases.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại thông tin còn thiếu hoặc xin xác nhận từ người dùng. Dùng response_type='text' khi thiếu mã máy cụ thể (asset_id) hoặc mã nhân viên (employee_id). Dùng response_type='choice' với options=['production', 'staging'] CHỈ KHI môi trường không xác định (ví dụ 'demo', 'dev'). Tuyệt đối không dùng clarify khi người dùng đã nói rõ 'production' hay 'staging'. Dùng response_type='yes_no' khi cần người dùng xác nhận hành động ghi dữ liệu như tạo ticket."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ hoặc nội dung yêu cầu xác nhận kèm tóm tắt chi tiết"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi: 'text' (hỏi thông tin thiếu), 'yes_no' (xác nhận hành động nhạy cảm/tạo ticket), 'choice' (chọn giữa các options)"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách lựa chọn khi response_type là choice, ví dụ ['production', 'staging']"}
      required: [question]

  - name: search_kb
    description: "Tìm kiếm hướng dẫn hỗ trợ kỹ thuật trong cơ sở tri thức (Knowledge Base)."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung cần tìm kiếm"}
        category: {type: string, enum: [all, vpn, email, wifi, printing, account, security, hardware, software, meeting_room], default: "all", description: "Nhóm hướng dẫn cụ thể"}
        top_k: {type: integer, default: 3, description: "Số kết quả tối đa"}
      required: [query]

  - name: check_service_status
    description: "Kiểm tra trạng thái hoạt động của dịch vụ nội bộ (vpn, email, sso, wifi, printing) trên môi trường production hoặc staging. Khi người dùng đã chỉ định 'production' hoặc 'staging', trực tiếp gọi tool này với environment tương ứng. Chỉ gọi clarify khi người dùng nêu môi trường không xác định (demo, dev, test)."
    parameters:
      type: object
      properties:
        service: {type: string, enum: [vpn, email, sso, wifi, printing], description: "Tên dịch vụ cần kiểm tra"}
        environment: {type: string, enum: [production, staging], default: "production", description: "Môi trường: production hoặc staging"}
      required: [service]

  - name: inspect_device
    description: "Kiểm tra thông tin chi tiết và chẩn đoán thiết bị theo mã tài sản (asset_id). Chỉ gọi khi có mã máy cụ thể (LT-xxxx, DT-xxxx); nếu thiếu mã (chỉ nói 'laptop', 'máy tính'), phải gọi clarify. Khi người dùng nêu sự cố thuộc lĩnh vực cụ thể (vpn, network, security, hardware, software), BẮT BUỘC chọn đúng enum check tương ứng, không được để 'all'."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản chuẩn của thiết bị, ví dụ LT-204, DT-031. Tuyệt đối không dùng mã nhân viên EMP-xxxx."}
        check: {type: string, enum: [all, network, vpn, security, hardware, software], default: "all", description: "Hạng mục chẩn đoán: chọn đúng 'vpn', 'network', 'security', 'hardware', hoặc 'software' khi sự cố đã xác định mảng cụ thể"}
      required: [asset_id]

  - name: lookup_user
    description: "Tra cứu thông tin nhân viên trong danh bạ nội bộ bằng mã nhân viên (employee_id). Kết quả trả về gồm thông tin cá nhân, phòng ban, trạng thái tài khoản và danh sách thiết bị được cấp (assigned_assets). Không gọi inspect_device bằng mã nhân viên. Nếu thiếu employee_id chuẩn (EMP-xxxx), phải gọi clarify."
    parameters:
      type: object
      properties:
        employee_id: {type: string, description: "Mã nhân viên định dạng EMP-xxxx (ví dụ EMP-1003). Không truyền tên phòng ban như Sales hay tên người."}
      required: [employee_id]

  - name: format_incident_report
    description: "Trình bày các kết quả đã thu thập thành báo cáo sự cố chuẩn hóa."
    parameters:
      type: object
      properties:
        findings:
          type: array
          default: []
          description: "Các kết quả đã thu thập từ các tool khác"
          items:
            type: object
            properties:
              label: {type: string}
              detail: {type: string}
              source: {type: string}
              status: {type: string}
        template: {type: string, enum: [brief, technical, handoff], default: "brief", description: "Mẫu báo cáo"}
        incident_title: {type: string, default: "IT incident", description: "Tiêu đề sự cố"}
      required: [findings, template]

  # ---------------- Optional/advanced tools ----------------
  - name: search_device_info
    description: "Tìm thông tin công khai về một model thiết bị trên web. Chỉ truyền hãng, model và loại thông tin; không truyền asset ID, employee ID hoặc dữ liệu nội bộ."
    parameters:
      type: object
      properties:
        manufacturer: {type: string, description: "Hãng sản xuất công khai, ví dụ Lenovo"}
        model: {type: string, description: "Tên model công khai, ví dụ ThinkPad T14 Gen 4"}
        query_type: {type: string, enum: [specs, drivers, support, compatibility], default: "support", description: "Loại thông tin cần tìm"}
        max_results: {type: integer, default: 3, description: "Số kết quả, tối đa 5"}
      required: [manufacturer, model, query_type]

  - name: policy
    description: "Tìm kiếm trong chính sách IT nội bộ của công ty."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung chính sách cần tra cứu"}
        policy_area: {type: string, enum: [all, access_control, data_privacy, external_tools, incident_response, service_operations, ticketing], default: "all", description: "Nhóm chính sách"}
        top_k: {type: integer, default: 3, description: "Số mục kết quả"}
      required: [query]

  - name: create_ticket
    description: "Tạo một ticket hỗ trợ kỹ thuật mới. Đây là hành động ghi nhạy cảm: CHỈ ĐƯỢC GỌI VỚI confirmed=true SAU KHI người dùng đã xác nhận rõ ràng ở lượt trước qua clarify(response_type='yes_no'). Ở lượt yêu cầu đầu tiên hoặc khi nội dung thay đổi/chưa xác nhận, KHÔNG ĐƯỢC gọi tool này mà phải gọi clarify để hỏi xác nhận."
    parameters:
      type: object
      properties:
        summary: {type: string, default: "", description: "Tóm tắt sự cố cần tạo ticket"}
        priority: {type: string, enum: [low, medium, high, critical], default: "medium", description: "Mức ưu tiên: low, medium, high, critical"}
        asset_id: {type: string, default: "", description: "Mã tài sản nếu có (ví dụ LT-204)"}
        confirmed: {type: boolean, default: false, description: "Chỉ đặt True khi người dùng đã xác nhận đồng ý rõ ràng ở lượt trước"}
      required: [summary]

  # ---------------- Team-built Bonus Tool ----------------
  - name: check_device_warranty
    description: "Tra cứu thông tin bảo hành phần cứng và gói dịch vụ hỗ trợ doanh nghiệp của thiết bị theo mã tài sản (asset_id). Trả về ngày hết hạn bảo hành, số ngày còn lại, trạng thái (active/expiring_soon/expired), cấp độ dịch vụ chính hãng và điều kiện sửa chữa/thay thế. Chỉ gọi khi có mã máy cụ thể (LT-xxxx, DT-xxxx); nếu thiếu, bắt buộc gọi clarify."
    parameters:
      type: object
      properties:
        asset_id: {type: string, description: "Mã tài sản của thiết bị cần tra cứu bảo hành (ví dụ LT-204, DT-031)"}
      required: [asset_id]
